<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E67E22"/>
      <stop offset="100%" stop-color="#CC5F00"/>
    </linearGradient>
    <linearGradient id="tGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <clipPath id="circleClip">
      <circle cx="128" cy="122" r="96"/>
    </clipPath>
  </defs>
  <!-- Background circle with gradient -->
  <circle cx="128" cy="122" r="96" fill="url(#bgGrad)" filter="url(#shadow)"/>
  <!-- Subtle inner highlight -->
  <circle cx="128" cy="122" r="96" fill="none" stroke="white" stroke-opacity="0.12" stroke-width="2"/>
  
  <!-- Letter T (scaled from original 1000 -> 256) -->
  <!-- Original T: M 152 215 L 575 215 C 570 240, 565 285, 570 345 L 445 348 C 448 450, 448 600, 452 785 L 282 785 C 285 600, 288 450, 290 350 L 152 350 Z -->
  <!-- Scale factor 0.256, offset to center -->
  <path d="M 42 58 L 147 58 C 146 64, 144 75, 146 89 L 114 90 C 115 115, 115 152, 116 198 L 74 198 C 75 152, 76 115, 77 90 L 42 90 Z" fill="url(#tGrad)"/>
  
  <!-- Letter C (scaled) -->
  <!-- Original C: M 825 435 C 800 405, 680 400, 560 480 C 470 540, 460 680, 515 765 C 570 850, 710 870, 825 830 L 820 710 C 740 750, 640 740, 615 690 C 590 640, 600 560, 665 520 C 725 480, 800 500, 825 530 Z -->
  <path d="M 204 111 C 198 104, 172 103, 144 122 C 122 137, 119 171, 132 192 C 145 213, 179 218, 204 208 L 203 179 C 185 189, 161 186, 155 173 C 149 161, 151 141, 167 131 C 182 121, 200 126, 204 133 Z" fill="#6A0808" stroke="black" stroke-opacity="0.15" stroke-width="1"/>
  
  <!-- Modern tab indicator: three window tabs at bottom hinting at innovative tab feature -->
  <g opacity="0.95" transform="translate(68, 178)">
    <rect x="0" y="0" width="120" height="28" rx="6" ry="6" fill="white" fill-opacity="0.92"/>
    <rect x="4" y="4" width="34" height="20" rx="4" fill="#CC5F00" fill-opacity="0.15"/>
    <rect x="42" y="4" width="34" height="20" rx="4" fill="#CC5F00" fill-opacity="0.08"/>
    <rect x="80" y="4" width="34" height="20" rx="4" fill="#CC5F00" fill-opacity="0.08"/>
    <!-- Active tab highlight -->
    <rect x="4" y="4" width="34" height="20" rx="4" fill="none" stroke="#CC5F00" stroke-width="1.2" stroke-opacity="0.9"/>
    <!-- Small dots for window controls -->
    <circle cx="14" cy="14" r="2" fill="#CC5F00" opacity="0.7"/>
    <circle cx="20" cy="14" r="2" fill="#CC5F00" opacity="0.5"/>
    <circle cx="26" cy="14" r="2" fill="#CC5F00" opacity="0.3"/>
  </g>
  
  <!-- Privacy shield badge top-right -->
  <g transform="translate(176, 28)">
    <circle r="18" cx="0" cy="0" fill="white" fill-opacity="0.96" stroke="black" stroke-opacity="0.08" stroke-width="1"/>
    <path d="M -6 -2 L 0 -7 L 6 -2 L 4 6 L -4 6 Z" fill="none" stroke="#CC5F00" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M -2 0 L 0 2 L 3 -2" fill="none" stroke="#2d7d46" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
